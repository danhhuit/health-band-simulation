<template>
  <main class="health-app" :class="{ 'dark-theme': theme === 'dark' }">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark"><v-icon icon="mdi-watch-variant"></v-icon></div>
        <div>
          <h1>{{ tr('Health overview') }}</h1>
          <p>{{ tr('Health Band 01 · Live simulation') }}</p>
        </div>
      </div>
      <div class="header-meta">
        <div class="header-actions" @click.stop>
          <button
            class="theme-toggle"
            :class="{ dark: theme === 'dark' }"

          </button>

          <div class="notification-center">
            <button
              class="notification-trigger"
              :class="{ active: notificationPanelOpen }"

              :title="tr('Notifications')"
              :aria-label="tr('Notifications')"

              <span v-if="unreadNotificationCount" class="notification-badge">{{ unreadNotificationCount > 9 ? '9+' : unreadNotificationCount }}</span>
            </button>

            <aside v-if="notificationPanelOpen" class="notification-panel">
              <div class="notification-head">
                <div>
                  <span>{{ tr('Notification center') }}</span>
                  <strong>{{ unreadNotificationCount }} {{ tr('unread') }}</strong>
                </div>
                <button @click="notificationPanelOpen = false" :aria-label="tr('Close')">
                  <v-icon icon="mdi-close" size="18"></v-icon>
                </button>
              </div>

              <div class="notification-tools">
                <button @click="markAllNotificationsRead" :disabled="!unreadNotificationCount">
                  <v-icon icon="mdi-check-all" size="15"></v-icon>{{ tr('Mark all as read') }}
                </button>
                <button @click="clearNotifications" :disabled="!notifications.length">
                  <v-icon icon="mdi-delete-outline" size="15"></v-icon>{{ tr('Clear') }}
                </button>
              </div>

              <div v-if="notifications.length" class="notification-list">
                <button
                  v-for="item in notifications"
                  :key="item.id"
                  class="notification-item"
                  :class="[item.tone, { unread: !item.read }]"
                  @click="markNotificationRead(item.id)"
                >
                  <span class="notification-icon"><v-icon :icon="item.icon" size="18"></v-icon></span>
                  <span class="notification-copy">
                    <strong>{{ tr(item.title) }}</strong>
                    <small>{{ item.detail }}</small>
                    <time>{{ item.time }}</time>
                  </span>
                  <i v-if="!item.read"></i>
                </button>
              </div>
              <div v-else class="notification-empty">
                <v-icon icon="mdi-bell-sleep-outline" size="30"></v-icon>
                <strong>{{ tr('No notifications') }}</strong>
                <p>{{ tr('Important device events and alerts will appear here.') }}</p>
              </div>
            </aside>
          </div>
        </div>

        <div class="language-switch" :aria-label="tr('Language selector')">
          <button :class="{ active: language === 'vi' }" @click="setLanguage('vi')" title="Tiếng Việt">
            <span class="flag">🇻🇳</span><span>Tiếng Việt</span>
          </button>
          <button :class="{ active: language === 'en' }" @click="setLanguage('en')" title="English">
            <span class="flag">🇺🇸</span><span>English</span>
          </button>
        </div>
        <span class="today">{{ formattedDate }}</span>
        <span class="connection" :class="{ online: isOnline }">
          <i></i>{{ isOnline ? tr('Connected') : tr('Disconnected') }}
        </span>
      </div>
    </header>

    <nav class="view-tabs" aria-label="Application views">
      <button :class="{ active: activeView === 'overview' }" @click="activeView = 'overview'">
        <v-icon icon="mdi-view-dashboard-outline"></v-icon>{{ tr('Overview') }}
      </button>
      <button :class="{ active: activeView === 'twin' }" @click="activeView = 'twin'">
        <v-icon icon="mdi-watch-variant"></v-icon>{{ tr('Digital twin') }}
      </button>
      <button :class="{ active: activeView === 'architecture' }" @click="activeView = 'architecture'">
        <v-icon icon="mdi-layers-triple-outline"></v-icon>{{ tr('IoT architecture') }}
      </button>
      <button :class="{ active: activeView === 'presenter' }" @click="activeView = 'presenter'">
        <v-icon icon="mdi-presentation-play"></v-icon>{{ tr('Presenter mode') }}
      </button>
      <button :class="{ active: activeView === 'smart' }" @click="activeView = 'smart'">
        <v-icon icon="mdi-brain"></v-icon>{{ tr('Smart coach') }}
      </button>
      <button :class="{ active: activeView === 'guide' }" @click="activeView = 'guide'">
        <v-icon icon="mdi-book-open-page-variant-outline"></v-icon>{{ tr('App guide') }}
      </button>
    </nav>

    <section v-if="emergency.active || emergency.status === 'sent'" class="emergency-banner" :class="emergency.status">
      <div class="emergency-icon"><v-icon icon="mdi-shield-alert-outline" size="30"></v-icon></div>
      <div class="emergency-copy">
        <span>{{ tr('Emergency assistance simulation') }}</span>
        <h2 v-if="emergency.active">{{ tr('Fall detected — sending simulated help in') }} {{ emergency.countdown }}s</h2>
        <h2 v-else>{{ tr('Simulated emergency notification sent') }}</h2>
        <p>{{ tr('This is a classroom simulation. No real emergency service is contacted.') }}</p>
      </div>
      <button v-if="emergency.active" @click="cancelEmergency">
        <v-icon icon="mdi-close-circle-outline"></v-icon>{{ tr('I am safe — cancel') }}
      </button>
      <button v-else @click="dismissEmergency">
        <v-icon icon="mdi-check"></v-icon>{{ tr('Dismiss') }}
      </button>
    </section>

    <section v-show="activeView === 'overview'">
    <section class="status-summary" :class="statusTone">
      <div class="status-icon">
        <v-icon :icon="statusIcon" size="28"></v-icon>
      </div>
      <div class="status-copy">
        <span>{{ tr('Current status') }}</span>
        <h2>{{ statusTitle }}</h2>
        <p>{{ statusDescription }}</p>
      </div>
      <div class="last-sync">
        <span>{{ tr('Last synced') }}</span>
        <strong>{{ lastUpdateText }}</strong>
      </div>
    </section>

    <section class="section-block">
      <div class="section-title">
        <div><h2>{{ tr('At a glance') }}</h2><p>{{ tr('Latest readings from the simulated wearable') }}</p></div>
      </div>

      <div class="metric-grid">
        <article class="metric-card">
          <div class="metric-head">
            <span class="metric-icon heart"><v-icon icon="mdi-heart-pulse"></v-icon></span>
            <span>{{ tr('Heart rate') }}</span>
          </div>
          <div class="metric-reading"><strong>{{ telemetry.heartRate }}</strong><small>BPM</small></div>
          <div class="metric-foot">
            <span :class="heartRateState.tone">{{ heartRateState.label }}</span>
            <span>{{ tr('70–90 normal demo range') }}</span>
          </div>
        </article>

        <article class="metric-card">
          <div class="metric-head">
            <span class="metric-icon oxygen"><v-icon icon="mdi-water-percent"></v-icon></span>
            <span>{{ tr('Blood oxygen') }}</span>
          </div>
          <div class="metric-reading"><strong>{{ telemetry.spo2 }}</strong><small>% SpO₂</small></div>
          <div class="metric-foot">
            <span :class="oxygenState.tone">{{ oxygenState.label }}</span>
            <span>{{ tr('97–99% normal demo range') }}</span>
          </div>
        </article>

        <article class="metric-card">
          <div class="metric-head">
            <span class="metric-icon steps"><v-icon icon="mdi-walk"></v-icon></span>
            <span>{{ tr('Steps') }}</span>
          </div>
          <div class="metric-reading"><strong>{{ telemetry.steps }}</strong><small>{{ tr('steps') }}</small></div>
          <div class="metric-foot">
            <span class="neutral">{{ tr('Today') }}</span>
            <span>{{ tr('Counter since device startup') }}</span>
          </div>
        </article>

        <article class="metric-card">
          <div class="metric-head">
            <span class="metric-icon battery"><v-icon icon="mdi-battery-medium"></v-icon></span>
            <span>{{ tr('Battery') }}</span>
          </div>
          <div class="metric-reading"><strong>{{ telemetry.battery }}</strong><small>%</small></div>
          <div class="battery-bar"><i :style="{ width: telemetry.battery + '%' }"></i></div>
          <div class="metric-foot">
            <span :class="batteryState.tone">{{ batteryState.label }}</span>
            <span>{{ tr('Estimated charge') }}</span>
          </div>
        </article>
      </div>

      <div class="smart-snapshot">
        <div>
          <span>{{ tr('Health score') }}</span>
          <strong :class="healthScoreTone">{{ healthScore }}<small>/100</small></strong>
          <p>{{ healthScoreLabel }}</p>
        </div>
        <div>
          <span>{{ tr('Step goal') }}</span>
          <strong>{{ Math.min(100, stepProgress) }}<small>%</small></strong>
          <p>{{ telemetry.steps.toLocaleString() }} / {{ stepGoal.toLocaleString() }} {{ tr('steps') }}</p>
        </div>
        <div>
          <span>{{ tr('Smart trend') }}</span>
          <strong><v-icon :icon="heartTrend.icon" size="18"></v-icon>{{ heartTrend.label }}</strong>
          <p>{{ tr('Based on the latest 10 samples') }}</p>
        </div>
        <button @click="activeView = 'smart'">
          <v-icon icon="mdi-arrow-right-circle-outline"></v-icon>{{ tr('Open Smart coach') }}
        </button>
      </div>
    </section>

    <section class="content-grid">
      <article class="panel trends-panel">
        <div class="section-title panel-title">
          <div><h2>{{ tr('Live trends') }}</h2><p>{{ tr('Most recent 40 telemetry samples') }}</p></div>
          <div class="chart-legend">
            <span><i class="heart-line"></i>{{ tr('Heart rate') }}</span>
            <span><i class="oxygen-line"></i>SpO₂</span>
          </div>
        </div>

        <div class="trend-row">
          <div class="trend-label">
            <span>{{ tr('Heart rate') }}</span>
            <strong>{{ telemetry.heartRate }} <small>BPM</small></strong>
          </div>
          <div class="chart-wrap">
            <svg viewBox="0 0 760 150" preserveAspectRatio="none" aria-label="Heart rate trend">
              <line v-for="y in [30,75,120]" :key="'hr'+y" x1="0" :y1="y" x2="760" :y2="y" class="grid-line"/>
              <polyline :points="heartRatePoints" class="data-line heart-data"/>
            </svg>
          </div>
        </div>

        <div class="trend-row">
          <div class="trend-label">
            <span>{{ tr('Blood oxygen') }}</span>
            <strong>{{ telemetry.spo2 }} <small>%</small></strong>
          </div>
          <div class="chart-wrap">
            <svg viewBox="0 0 760 150" preserveAspectRatio="none" aria-label="Blood oxygen trend">
              <line v-for="y in [30,75,120]" :key="'sp'+y" x1="0" :y1="y" x2="760" :y2="y" class="grid-line"/>
              <polyline :points="spo2Points" class="data-line oxygen-data"/>
            </svg>
          </div>
        </div>
      </article>

      <aside class="panel device-panel">
        <div class="section-title panel-title"><div><h2>{{ tr('Device details') }}</h2><p>{{ tr('Connection and data quality') }}</p></div></div>
        <dl class="detail-list">
          <div><dt>{{ tr('Device ID') }}</dt><dd>{{ telemetry.deviceId }}</dd></div>
          <div><dt>{{ tr('Connection') }}</dt><dd><span class="mini-dot" :class="{ online: isOnline }"></span>{{ isOnline ? tr('Online') : tr('Offline') }}</dd></div>
          <div><dt>{{ tr('Signal quality') }}</dt><dd>{{ signalText }}</dd></div>
          <div><dt>{{ tr('Active scenario') }}</dt><dd>{{ activeModeLabel }}</dd></div>
          <div><dt>{{ tr('Sequence number') }}</dt><dd>#{{ telemetry.seq }}</dd></div>
          <div><dt>{{ tr('Update interval') }}</dt><dd>{{ samplingIntervalLabel }}</dd></div>
        </dl>
        <div class="device-note">
          <v-icon icon="mdi-information-outline" size="18"></v-icon>
          {{ tr('Values are generated by an ESP32 simulation in Wokwi.') }}
        </div>
      </aside>
    </section>

    <section class="content-grid lower-grid">
      <article class="panel controls-panel">
        <div class="section-title panel-title">
          <div><h2>{{ tr('Demo controls') }}</h2><p>{{ tr('Choose a scenario to change the simulated readings') }}</p></div>
          <span class="command-status">{{ tr(commandState) }}</span>
        </div>

        <div class="scenario-grid">
          <button :class="{ selected: activeMode === 'normal' }" @click="sendMode('normal')">
            <v-icon icon="mdi-check-circle-outline"></v-icon><span><strong>{{ tr('Normal') }}</strong><small>{{ tr('Healthy readings') }}</small></span>
          </button>
          <button :class="{ selected: activeMode === 'high_hr' }" @click="sendMode('high_hr')">
            <v-icon icon="mdi-arrow-up"></v-icon><span><strong>{{ tr('High heart rate') }}</strong><small>125–145 BPM</small></span>
          </button>
          <button :class="{ selected: activeMode === 'low_hr' }" @click="sendMode('low_hr')">
            <v-icon icon="mdi-arrow-down"></v-icon><span><strong>{{ tr('Low heart rate') }}</strong><small>40–48 BPM</small></span>
          </button>
          <button :class="{ selected: activeMode === 'low_spo2' }" @click="sendMode('low_spo2')">
            <v-icon icon="mdi-water-minus-outline"></v-icon><span><strong>{{ tr('Low SpO₂') }}</strong><small>85–92%</small></span>
          </button>
          <button class="critical-button" :class="{ selected: activeMode === 'fall' }" @click="sendMode('fall')">
            <v-icon icon="mdi-alert-outline"></v-icon><span><strong>{{ tr('Fall detected') }}</strong><small>{{ tr('Emergency event') }}</small></span>
          </button>
          <button :class="{ selected: activeMode === 'low_battery' }" @click="sendMode('low_battery')">
            <v-icon icon="mdi-battery-alert"></v-icon><span><strong>{{ tr('Low battery') }}</strong><small>12–19%</small></span>
          </button>
        </div>
        <button class="reset-button" @click="resetSteps"><v-icon icon="mdi-restart" size="18"></v-icon>{{ tr('Reset step counter') }}</button>
      </article>

      <aside class="panel alerts-panel">
        <div class="section-title panel-title">
          <div><h2>{{ tr('Health alerts') }}</h2><p>{{ tr('Demo thresholds requiring attention') }}</p></div>
          <span class="alert-count">{{ activeAlerts.length }}</span>
        </div>

        <div v-if="activeAlerts.length" class="alert-list">
          <div v-for="alert in activeAlerts" :key="alert.code" class="alert-item" :class="alert.severity">
            <v-icon :icon="alert.severity === 'critical' ? 'mdi-alert-octagon-outline' : 'mdi-alert-circle-outline'"></v-icon>
            <div>
              <strong>{{ alert.title }}</strong><p>{{ alert.detail }}</p>
              <span v-if="alert.acknowledged" class="ack-badge"><v-icon icon="mdi-check-circle" size="13"></v-icon>{{ tr('Acknowledged') }}</span>
            </div>
            <button v-if="!alert.acknowledged" class="ack-button" @click="acknowledgeAlert(alert)">
              {{ tr('Acknowledge') }}
            </button>
          </div>
        </div>
        <div v-else class="clear-state">
          <v-icon icon="mdi-check-circle-outline" size="26"></v-icon>
          <div><strong>{{ tr('No active alerts') }}</strong><p>{{ tr('All readings are within the configured demo limits.') }}</p></div>
        </div>

        <p class="medical-note">{{ tr('For educational demonstration only. This dashboard is not intended for medical diagnosis.') }}</p>
      </aside>
    </section>
    <section class="panel activity-panel overview-activity">
      <div class="section-title panel-title">
        <div><h2>{{ tr('Recent activity') }}</h2><p>{{ tr('Commands and acknowledgements across the IoT system') }}</p></div>
        <span class="event-total">{{ activity.length }}</span>
      </div>
      <div class="activity-list">
        <div v-for="item in activity.slice(0, 6)" :key="item.id" class="activity-row">
          <span class="activity-time">{{ item.time }}</span>
          <span class="activity-source" :class="item.sourceClass">{{ tr(item.source) }}</span>
          <div><strong>{{ tr(item.title) }}</strong><p>{{ tr(item.detail) }}</p></div>
        </div>
        <div v-if="!activity.length" class="empty-activity">{{ tr('Interact with the dashboard to create a traceable event.') }}</div>
      </div>
    </section>
    </section>

    <section v-show="activeView === 'twin'" class="interactive-view">
      <div class="view-heading">
        <div><span>{{ tr('Interactive demonstration') }}</span><h2>{{ tr('Health Band digital twin') }}</h2><p>{{ tr('The virtual wearable mirrors live telemetry and device outputs from Wokwi.') }}</p></div>
        <span class="connection" :class="{ online: isOnline }"><i></i>{{ isOnline ? tr('Live device link') : tr('Device unavailable') }}</span>
      </div>

      <div class="twin-layout">
        <article class="panel band-lab">
          <div class="band-stage">
            <div class="watch-shadow"></div>
            <div class="watch-strap strap-top"></div>
            <div class="watch-body" :class="statusTone">
              <div class="watch-crown"></div>
              <div class="watch-screen">
                <div class="watch-status">
                  <span>{{ isOnline ? tr('LIVE') : tr('OFFLINE') }}</span>
                  <span><v-icon icon="mdi-battery-medium" size="13"></v-icon>{{ telemetry.battery }}%</span>
                </div>
                <div class="watch-time">{{ watchTime }}</div>
                <div class="watch-vitals">
                  <div><v-icon icon="mdi-heart-pulse"></v-icon><strong>{{ telemetry.heartRate }}</strong><small>BPM</small></div>
                  <div><v-icon icon="mdi-water-percent"></v-icon><strong>{{ telemetry.spo2 }}</strong><small>SpO₂</small></div>
                </div>
                <div class="watch-footer"><v-icon icon="mdi-walk" size="13"></v-icon>{{ telemetry.steps }} {{ tr('steps') }} · {{ activeModeLabel }}</div>
              </div>
              <span class="device-led" :class="rgbState"></span>
            </div>
            <div class="watch-strap strap-bottom"></div>
          </div>
          <div class="band-actions">
            <button @click="sendMode('normal')"><v-icon icon="mdi-check-circle-outline"></v-icon>{{ tr('Return to normal') }}</button>
            <button class="sos-action" @click="sendMode('fall')"><v-icon icon="mdi-alert-outline"></v-icon>{{ tr('Trigger FALL / SOS') }}</button>
          </div>
        </article>

        <aside class="twin-side">
          <article class="panel hardware-panel">
            <div class="section-title panel-title"><div><h2>{{ tr('Device outputs') }}</h2><p>{{ tr('What the audience should observe') }}</p></div></div>
            <div class="output-list">
              <div><span class="output-icon"><v-icon icon="mdi-monitor-small"></v-icon></span><div><strong>{{ tr('OLED display') }}</strong><p>{{ tr('Shows HR, SpO₂, steps, battery and active scenario.') }}</p></div><b>{{ tr('ON') }}</b></div>
              <div><span class="output-icon"><v-icon icon="mdi-led-on"></v-icon></span><div><strong>{{ tr('RGB state light') }}</strong><p>{{ tr('Green normal, amber warning, red fall, blue disconnected.') }}</p></div><b :class="rgbState">{{ rgbStateLabel }}</b></div>
              <div><span class="output-icon"><v-icon icon="mdi-volume-high"></v-icon></span><div><strong>{{ tr('Alert buzzer') }}</strong><p>{{ tr('Sounds when a warning or fall scenario is activated.') }}</p></div><b>{{ buzzerState }}</b></div>
              <div><span class="output-icon"><v-icon icon="mdi-gesture-tap-button"></v-icon></span><div><strong>{{ tr('FALL / SOS button') }}</strong><p>{{ tr('Press the red button in Wokwi or press the F key.') }}</p></div><b>{{ tr('READY') }}</b></div>
            </div>
          </article>

          <article class="panel causal-panel">
            <div class="section-title panel-title"><div><h2>{{ tr('Cause and effect') }}</h2><p>{{ tr('Proof that this is an interactive IoT system') }}</p></div></div>
            <ol>
              <li :class="{ done: commandState !== 'Ready' }"><span>1</span>{{ tr('Viewer selects a scenario') }}</li>
              <li :class="{ done: lastAcknowledgement }"><span>2</span>{{ tr('ESP32 acknowledges the command') }}</li>
              <li :class="{ done: telemetry.mode === activeMode }"><span>3</span>{{ tr('Wearable changes its readings') }}</li>
              <li :class="{ done: activeAlerts.length }"><span>4</span>{{ tr('Node-RED evaluates an alert') }}</li>
              <li :class="{ done: isOnline }"><span>5</span>{{ tr('Application visualizes the result') }}</li>
            </ol>
            <div class="ack-box">
              <span>{{ tr('Latest device acknowledgement') }}</span>
              <strong>{{ lastAcknowledgement || tr('Waiting for the upgraded firmware event topic') }}</strong>
            </div>
          </article>
        </aside>
      </div>
    </section>

    <section v-show="activeView === 'architecture'" class="interactive-view">
      <div class="view-heading">
        <div><span>{{ tr('System learning mode') }}</span><h2>{{ tr('Four-layer IoT architecture') }}</h2><p>{{ tr('Select a layer to explain its responsibility and its implementation in this project.') }}</p></div>
        <button class="journey-button" @click="playDataJourney"><v-icon icon="mdi-play"></v-icon>{{ journeyRunning ? tr('Playing data journey') : tr('Play data journey') }}</button>
      </div>

      <div class="architecture-flow">
        <button v-for="(layer, index) in architectureLayers" :key="layer.id"
                class="layer-card" :class="[layer.tone, { selected: selectedLayer === index, pulse: journeyStep === index }]"
                @click="selectedLayer = index">
          <span class="layer-number">0{{ index + 1 }}</span>
          <v-icon :icon="layer.icon" size="28"></v-icon>
          <strong>{{ tr(layer.name) }}</strong>
          <small>{{ tr(layer.short) }}</small>
        </button>
        <div class="flow-line"><i :style="{ width: ((journeyStep + 1) * 25) + '%' }"></i></div>
      </div>

      <div class="architecture-detail">
        <article class="panel selected-layer">
          <span class="layer-kicker">{{ tr('LAYER') }} 0{{ selectedLayer + 1 }}</span>
          <h2>{{ tr(selectedLayerData.name) }}</h2>
          <p class="layer-purpose">{{ tr(selectedLayerData.purpose) }}</p>
          <div class="layer-info-grid">
            <div><span>{{ tr('Components in this project') }}</span><strong>{{ tr(selectedLayerData.components) }}</strong></div>
            <div><span>{{ tr('What it does') }}</span><strong>{{ tr(selectedLayerData.operation) }}</strong></div>
            <div><span>{{ tr('Why it matters') }}</span><strong>{{ tr(selectedLayerData.value) }}</strong></div>
            <div><span>{{ tr('Evidence during demo') }}</span><strong>{{ tr(selectedLayerData.evidence) }}</strong></div>
          </div>
        </article>
        <aside class="panel payload-panel">
          <div class="section-title panel-title"><div><h2>{{ tr('Live data packet') }}</h2><p>{{ tr('JSON traveling through the four layers') }}</p></div></div>
          <pre>{{ livePacket }}</pre>
          <div class="topic-chip"><span>{{ tr('MQTT topic') }}</span><strong>.../health-band/telemetry</strong></div>
        </aside>
      </div>
    </section>

    <section v-show="activeView === 'presenter'" class="interactive-view">
      <div class="view-heading">
        <div><span>{{ tr('Guided classroom demo') }}</span><h2>{{ tr('Presenter mode') }}</h2><p>{{ tr('Use this sequence to involve the audience and explain each system reaction.') }}</p></div>
        <span class="step-counter">{{ tr('Step') }} {{ presenterIndex + 1 }} / {{ presenterSteps.length }}</span>
      </div>

      <div class="presenter-layout">
        <article class="panel presenter-card">
          <div class="presenter-progress"><i :style="{ width: ((presenterIndex + 1) / presenterSteps.length * 100) + '%' }"></i></div>
          <span class="presenter-label">{{ tr(presenterStep.label) }}</span>
          <h2>{{ tr(presenterStep.title) }}</h2>
          <p>{{ tr(presenterStep.description) }}</p>
          <div class="audience-prompt">
            <v-icon icon="mdi-account-voice"></v-icon>
            <div><span>{{ tr('Ask the audience') }}</span><strong>{{ tr(presenterStep.question) }}</strong></div>
          </div>

  computed: {
    unreadNotificationCount () {
      return this.notifications.filter(item => !item.read).length
    },
    isOnline () {
      const timeout = Math.max(12000, Number(this.telemetry.samplingIntervalMs || 2000) * 2.5)
      return this.lastSeen > 0 && this.now - this.lastSeen <= timeout
    },
    formattedDate () {
      return new Intl.DateTimeFormat(this.language === 'vi' ? 'vi-VN' : 'en-US', { weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(this.now))
    },
    watchTime () {
      return new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(this.now))
    },
    lastUpdateText () {
      if (!this.lastSeen) return this.tr('Waiting for data')
      const seconds = Math.max(0, Math.floor((this.now - this.lastSeen) / 1000))
      if (seconds < 2) return this.tr('Just now')
      return this.language === 'vi' ? `${seconds} giây trước` : `${seconds} seconds ago`
    },
    activeModeLabel () {
      return this.tr(({
        normal: 'Normal',
        high_hr: 'High heart rate',
        low_hr: 'Low heart rate',
        low_spo2: 'Low SpO₂',
        fall: 'Fall detected',
        low_battery: 'Low battery'
      })[this.activeMode] || 'Normal')
    },
    activeThresholds () {
      return ({
        student: { highHr: 120, lowHr: 50, lowSpo2: 94 },
        older_adult: { highHr: 110, lowHr: 50, lowSpo2: 94 },
        athlete: { highHr: 130, lowHr: 45, lowSpo2: 93 }
      })[this.profile] || { highHr: 120, lowHr: 50, lowSpo2: 94 }
    },
    stepProgress () {
      if (!this.stepGoal) return 0
      return Math.max(0, Math.round((this.telemetry.steps / this.stepGoal) * 100))
    },
    scoreBreakdown () {
      const t = this.telemetry
      let vitals = 0
      if (t.heartRate > 0) vitals += (t.heartRate >= this.activeThresholds.lowHr && t.heartRate <= this.activeThresholds.highHr) ? 25 : 8
      if (t.spo2 > 0) vitals += t.spo2 >= this.activeThresholds.lowSpo2 ? 25 : 6
      let safety = this.isOnline ? 20 : 8
      if (t.fallDetected) safety = 0
      const activity = Math.min(20, Math.round(this.stepProgress * 0.2))
      let device = t.battery >= 50 ? 6 : (t.battery > 20 ? 4 : 2)
      device += t.signalQuality === 'good' ? 4 : (t.signalQuality === 'medium' ? 3 : 1)
      return { vitals, safety, activity, device: Math.min(10, device) }
    },
    healthScore () {
      const b = this.scoreBreakdown
      return Math.max(0, Math.min(100, b.vitals + b.safety + b.activity + b.device))
    },
    healthScoreLabel () {
      if (this.healthScore >= 85) return this.tr('Excellent')
      if (this.healthScore >= 70) return this.tr('Good wellness state')
      if (this.healthScore >= 45) return this.tr('Needs attention')
      return this.tr('Critical attention')
    },
    healthScoreTone () {
      if (this.healthScore >= 85) return 'excellent'
      if (this.healthScore >= 70) return 'good'
      if (this.healthScore >= 45) return 'warning'
      return 'critical'
    },
    scoreExplanation () {
      if (!this.isOnline) return this.language === 'vi' ? 'Điểm giảm vì thiết bị đang offline.' : 'The score is reduced because the device is offline.'
      if (this.telemetry.fallDetected) return this.language === 'vi' ? 'Sự kiện té ngã làm giảm mạnh thành phần an toàn.' : 'The fall event strongly reduces the safety component.'
      if (this.activeAlerts.length) return this.language === 'vi' ? 'Một hoặc nhiều chỉ số đã được xác nhận bất thường.' : 'One or more readings have a confirmed abnormal state.'
      if (this.stepProgress < 50) return this.language === 'vi' ? 'Các chỉ số ổn định; hoàn thành thêm mục tiêu bước để tăng điểm.' : 'Vitals are stable; make more progress toward the step goal to improve the score.'
      return this.language === 'vi' ? 'Các chỉ số, an toàn và tiến độ hoạt động đang ở trạng thái tốt.' : 'Vitals, safety and activity progress are in a good state.'
    },
    heartTrend () {
      return this.calculateTrend('heartRate', 3, 'BPM')
    },
    spoTrend () {
      return this.calculateTrend('spo2', 1, '%')
    },
    stepTrend () {
      if (this.history.length < 2) return { label: this.tr('Not enough data'), detail: this.tr('Based on the latest 10 samples'), tone: 'neutral', icon: 'mdi-minus' }
      const recent = this.history.slice(-10)
      const delta = recent[recent.length - 1].steps - recent[0].steps
      return {
        label: delta > 0 ? this.tr('Rising') : this.tr('Stable'),
        detail: this.language === 'vi' ? `Tăng ${Math.max(0, delta)} bước trong cửa sổ gần nhất.` : `Added ${Math.max(0, delta)} steps in the latest window.`,
        tone: delta > 0 ? 'good' : 'neutral',
        icon: delta > 0 ? 'mdi-trending-up' : 'mdi-minus'
      }
    },
    smartSuggestions () {
      const suggestions = []
      const vi = this.language === 'vi'
      if (!this.isOnline) suggestions.push({ code: 'offline', tone: 'critical', icon: 'mdi-wifi-off', title: vi ? 'Kiểm tra kết nối' : 'Check the connection', detail: vi ? 'Thiết bị không gửi dữ liệu; hãy kiểm tra Wokwi, Wi-Fi và broker.' : 'The device is not sending data; check Wokwi, Wi-Fi and the broker.' })
      if (this.telemetry.fallDetected) suggestions.push({ code: 'fall', tone: 'critical', icon: 'mdi-shield-alert-outline', title: vi ? 'Xác minh an toàn ngay' : 'Verify safety now', detail: vi ? 'Té ngã được phát hiện. Trong demo, hãy hủy đếm ngược nếu người đeo an toàn.' : 'A fall was detected. In the demo, cancel the countdown if the wearer is safe.' })
      if (this.confirmedAlertCodes.includes('high-hr')) suggestions.push({ code: 'high-hr', tone: 'warning', icon: 'mdi-heart-pulse', title: vi ? 'Nhịp tim cao liên tiếp' : 'Repeated high heart rate', detail: vi ? 'Đã vượt ngưỡng hồ sơ 3 mẫu liên tiếp; kiểm tra tình huống và vị trí đeo.' : 'The profile threshold was exceeded for 3 samples; check the scenario and band position.' })
      if (this.confirmedAlertCodes.includes('low-hr')) suggestions.push({ code: 'low-hr', tone: 'warning', icon: 'mdi-heart-broken-outline', title: vi ? 'Nhịp tim thấp liên tiếp' : 'Repeated low heart rate', detail: vi ? 'Kiểm tra chất lượng dữ liệu và tình huống mô phỏng.' : 'Check data quality and the active simulation scenario.' })
      if (this.confirmedAlertCodes.includes('low-spo2')) suggestions.push({ code: 'low-spo2', tone: 'warning', icon: 'mdi-water-percent-alert', title: vi ? 'SpO₂ thấp liên tiếp' : 'Repeated low SpO₂', detail: vi ? 'Kiểm tra lại vị trí đeo mô phỏng; không dùng kết quả này để chẩn đoán.' : 'Check the simulated fit; do not use this result for diagnosis.' })
      if (this.telemetry.battery <= 20) suggestions.push({ code: 'battery', tone: 'warning', icon: 'mdi-battery-alert', title: vi ? 'Tiết kiệm pin' : 'Save battery', detail: vi ? 'Thiết bị chuyển sang chu kỳ 8 giây để mô phỏng tiết kiệm năng lượng.' : 'The device switches to an 8-second cycle to simulate power saving.' })
      if (this.stepProgress < 50 && !this.telemetry.fallDetected) suggestions.push({ code: 'steps', tone: 'info', icon: 'mdi-walk', title: vi ? 'Tiếp tục mục tiêu vận động' : 'Continue the activity goal', detail: vi ? `Đã hoàn thành ${Math.min(100, this.stepProgress)}% mục tiêu ${this.stepGoal.toLocaleString()} bước.` : `${Math.min(100, this.stepProgress)}% of the ${this.stepGoal.toLocaleString()}-step goal is complete.` })
      if (this.dataQualityWarnings.length) suggestions.push({ code: 'quality', tone: 'warning', icon: 'mdi-database-alert-outline', title: vi ? 'Xem lại chất lượng dữ liệu' : 'Review data quality', detail: vi ? 'Có cảnh báo về seq, timestamp, trường bắt buộc hoặc miền giá trị.' : 'There are warnings about sequence, timestamp, required fields or value ranges.' })
      if (!suggestions.length) suggestions.push({ code: 'good', tone: 'good', icon: 'mdi-check-decagram-outline', title: vi ? 'Phiên mô phỏng ổn định' : 'Stable simulated session', detail: vi ? 'Chưa phát hiện cảnh báo cần xử lý trong dữ liệu hiện tại.' : 'No actionable warning is present in the current data.' })
      return suggestions
    },
    comparisonRows () {
      const base = this.normalBaseline || { heartRate: 80, spo2: 98, steps: 0, battery: 100 }
      const formatDelta = (value, suffix = '') => `${value > 0 ? '+' : ''}${value}${suffix}`
      return [
        { metric: 'HR', baseline: `${base.heartRate} BPM`, current: `${this.telemetry.heartRate} BPM`, delta: formatDelta(this.telemetry.heartRate - base.heartRate, ' BPM'), tone: Math.abs(this.telemetry.heartRate - base.heartRate) > 20 ? 'bad' : 'neutral' },
        { metric: 'SpO₂', baseline: `${base.spo2}%`, current: `${this.telemetry.spo2}%`, delta: formatDelta(this.telemetry.spo2 - base.spo2, '%'), tone: this.telemetry.spo2 < base.spo2 - 3 ? 'bad' : 'neutral' },
        { metric: this.tr('Steps'), baseline: base.steps.toLocaleString(), current: this.telemetry.steps.toLocaleString(), delta: formatDelta(this.telemetry.steps - base.steps), tone: 'good' },
        { metric: this.tr('Battery'), baseline: `${base.battery}%`, current: `${this.telemetry.battery}%`, delta: formatDelta(this.telemetry.battery - base.battery, '%'), tone: this.telemetry.battery <= 20 ? 'bad' : 'neutral' }
      ]
    },
    samplingIntervalLabel () {
      return this.tr(this.powerMode === 'eco' ? 'Eco updates every 8 seconds' : 'Live updates every 2 seconds')
    },
    guidedDemoProgress () {
      if (!this.guidedDemo.running) return 0
      return Math.round(((this.guidedDemo.index + 1) / this.guidedDemo.sequence.length) * 100)
    },
    selectedLayerData () {
      return this.architectureLayers[this.selectedLayer]
    },
    presenterStep () {
      return this.presenterSteps[this.presenterIndex]
    },
    livePacket () {
      return JSON.stringify({
        deviceId: this.telemetry.deviceId,
        seq: this.telemetry.seq,
        heartRate: this.telemetry.heartRate,
        spo2: this.telemetry.spo2,
        steps: this.telemetry.steps,
        battery: this.telemetry.battery,
        fallDetected: this.telemetry.fallDetected,
        signalQuality: this.telemetry.signalQuality,
        mode: this.telemetry.mode
      }, null, 2)
    },
    rgbState () {
      if (!this.isOnline) return 'blue'
      if (this.telemetry.fallDetected || this.activeMode === 'fall') return 'red'
      if (this.activeMode === 'normal') return 'green'
      return 'amber'
    },
    rgbStateLabel () {
      return this.tr(({ blue: 'BLUE', red: 'RED', green: 'GREEN', amber: 'AMBER' })[this.rgbState])
    },
    buzzerState () {
      if (this.activeMode === 'fall') return this.tr('CRITICAL')
      return this.activeMode === 'normal' ? this.tr('STANDBY') : this.tr('BEEP')
    },
    signalText () {
      const value = String(this.telemetry.signalQuality || 'unknown')
      return this.tr(({ good: 'Good', medium: 'Medium', poor: 'Poor', unknown: 'Unknown' })[value] || 'Unknown')
    },
    statusTitle () {
      if (!this.isOnline) return this.tr('Device is offline')
      if (this.telemetry.fallDetected) return this.tr('Fall detected')
      if (this.confirmedAlertCodes.includes('high-hr')) return this.tr('Heart rate is above the demo range')
      if (this.confirmedAlertCodes.includes('low-hr')) return this.tr('Heart rate is below the demo range')
      if (this.confirmedAlertCodes.includes('low-spo2')) return this.tr('Blood oxygen is below the demo range')
      if (this.telemetry.battery <= 20) return this.tr('Device battery is low')
      return this.tr('Readings look normal')
    },
    statusDescription () {
      if (!this.isOnline) return this.tr('No telemetry has been received in the last 8 seconds.')
      if (this.activeAlerts.length) return this.tr('Review the active alert details below.')
      return this.tr('No simulated health alerts require attention right now.')
    },
    statusTone () {
      if (!this.isOnline || this.telemetry.fallDetected) return 'critical'
      return this.activeAlerts.length ? 'warning' : 'healthy'
    },
    statusIcon () {
      if (!this.isOnline) return 'mdi-cloud-off-outline'
      if (this.telemetry.fallDetected) return 'mdi-alert-octagon-outline'
      return this.activeAlerts.length ? 'mdi-alert-circle-outline' : 'mdi-check-circle-outline'
    },
    heartRateState () {
      if (!this.telemetry.heartRate) return { label: this.tr('Waiting'), tone: 'neutral' }
      if (this.telemetry.heartRate > this.activeThresholds.highHr) return { label: `${this.tr('High')} ${this.alertCounters.highHr}/3`, tone: 'bad' }
      if (this.telemetry.heartRate < this.activeThresholds.lowHr) return { label: `${this.tr('Low')} ${this.alertCounters.lowHr}/3`, tone: 'bad' }
      return { label: this.tr('In range'), tone: 'good' }
    },
    oxygenState () {
      if (!this.telemetry.spo2) return { label: this.tr('Waiting'), tone: 'neutral' }
      return this.telemetry.spo2 < this.activeThresholds.lowSpo2 ? { label: `${this.tr('Low')} ${this.alertCounters.lowSpo2}/3`, tone: 'bad' } : { label: this.tr('In range'), tone: 'good' }
    },
    batteryState () {
      if (!this.isOnline) return { label: this.tr('Unknown'), tone: 'neutral' }
      return this.telemetry.battery <= 20 ? { label: this.tr('Low'), tone: 'bad' } : { label: this.tr('Good'), tone: 'good' }
    },
    activeAlerts () {
      const t = this.telemetry
      const alerts = []
      if (!this.isOnline) alerts.push({ code: 'offline', severity: 'critical', title: this.tr('Device offline'), detail: this.tr('No telemetry received for more than 8 seconds.') })
      if (t.fallDetected) alerts.push({ code: 'fall', severity: 'critical', title: this.tr('Fall detected'), detail: this.tr('The simulated fall event has been triggered.') })
      if (this.confirmedAlertCodes.includes('high-hr')) alerts.push({ code: 'high-hr', severity: 'warning', title: this.tr('High heart rate'), detail: this.language === 'vi' ? `${t.heartRate} BPM vượt ngưỡng hồ sơ ${this.activeThresholds.highHr} BPM trong 3 mẫu liên tiếp.` : `${t.heartRate} BPM exceeded the ${this.activeThresholds.highHr} BPM profile threshold for 3 consecutive samples.` })
      if (this.confirmedAlertCodes.includes('low-hr')) alerts.push({ code: 'low-hr', severity: 'warning', title: this.tr('Low heart rate'), detail: this.language === 'vi' ? `${t.heartRate} BPM thấp hơn ngưỡng hồ sơ ${this.activeThresholds.lowHr} BPM trong 3 mẫu liên tiếp.` : `${t.heartRate} BPM was below the ${this.activeThresholds.lowHr} BPM profile threshold for 3 consecutive samples.` })
      if (this.confirmedAlertCodes.includes('low-spo2')) alerts.push({ code: 'low-spo2', severity: 'warning', title: this.tr('Low blood oxygen'), detail: this.language === 'vi' ? `${t.spo2}% thấp hơn ngưỡng hồ sơ ${this.activeThresholds.lowSpo2}% trong 3 mẫu liên tiếp.` : `${t.spo2}% was below the ${this.activeThresholds.lowSpo2}% profile threshold for 3 consecutive samples.` })
      if (this.isOnline && t.battery <= 20) alerts.push({ code: 'battery', severity: 'warning', title: this.tr('Low battery'), detail: this.language === 'vi' ? `Pin còn ${t.battery}%.` : `${t.battery}% battery remaining.` })
      return alerts.map(alert => ({ ...alert, acknowledged: Boolean(this.acknowledgedAlerts[alert.code]) }))
    },
    heartRatePoints () {
      return this.makePoints('heartRate', 35, 155)
    },
    spo2Points () {
      return this.makePoints('spo2', 80, 100)
    }
  },
  mounted () {
    document.documentElement.lang = this.language
    this.applyTheme()
    this.consumeMessage(this.msg)
    this.socketHandler = message => this.consumeMessage(message)
    this.$socket.on('msg-input:' + this.id, this.socketHandler)
    const requestedView = new URLSearchParams(window.location.search).get('view')
    if (['overview', 'twin', 'architecture', 'presenter', 'smart', 'guide'].includes(requestedView)) {
      this.activeView = requestedView
    }
    this.clock = setInterval(() => { this.now = Date.now() }, 1000)
    this.outsideHeaderHandler = () => { this.notificationPanelOpen = false }
    document.addEventListener('click', this.outsideHeaderHandler)
    this.pushNotification(
      'Dashboard ready',
      this.tr('Notification center is ready to receive device events and alerts.'),
      'info',
      'mdi-view-dashboard-check-outline'
    )
  },
  unmounted () {
    clearInterval(this.clock)
    if (this.journeyTimer) clearInterval(this.journeyTimer)
    if (this.emergencyTimer) clearInterval(this.emergencyTimer)
    if (this.guidedDemo.timer) clearInterval(this.guidedDemo.timer)
    if (this.socketHandler) this.$socket.off('msg-input:' + this.id, this.socketHandler)
    if (this.outsideHeaderHandler) document.removeEventListener('click', this.outsideHeaderHandler)
    document.body.classList.remove('health-band-dark-theme')
  },
  methods: {
    tr (text) {
      if (this.language !== 'vi') return text
      return this.viTranslations[text] || text
    },
    setLanguage (language) {
      this.language = language
      localStorage.setItem('healthBandLanguage', language)
      document.documentElement.lang = language
    },
    applyTheme () {
      const isDark = this.theme === 'dark'
      document.body.classList.toggle('health-band-dark-theme', isDark)
      document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
    },
    toggleTheme () {
      this.theme = this.theme === 'dark' ? 'light' : 'dark'
      localStorage.setItem('healthBandTheme', this.theme)
      this.applyTheme()
      const enabledText = this.theme === 'dark' ? this.tr('Dark theme enabled') : this.tr('Light theme enabled')
      this.pushNotification(
        'Theme changed',
        enabledText,
        'info',
        this.theme === 'dark' ? 'mdi-weather-night' : 'mdi-weather-sunny'
      )
    },
    toggleNotificationPanel () {
      this.notificationPanelOpen = !this.notificationPanelOpen
    },
    pushNotification (title, detail, tone = 'info', icon = 'mdi-information-outline') {
      const createdAt = Date.now()
      const duplicate = this.notifications.find(item =>
        item.title === title &&
        item.detail === detail &&
        createdAt - item.createdAt < 5000
      )
      if (duplicate) return
      this.notifications.unshift({
        id: ++this.notificationId,
        title,
        detail,
        tone,
        icon,
        read: false,
        createdAt,
        time: new Intl.DateTimeFormat(this.language === 'vi' ? 'vi-VN' : 'en-US', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        }).format(new Date(createdAt))
      })
      if (this.notifications.length > 20) this.notifications.pop()
    },
    markNotificationRead (id) {
      this.notifications = this.notifications.map(item => item.id === id ? { ...item, read: true } : item)
    },
    markAllNotificationsRead () {
      this.notifications = this.notifications.map(item => ({ ...item, read: true }))
    },
    clearNotifications () {
      this.notifications = []
      this.notificationPanelOpen = false
    },
    calculateTrend (key, deadband, unit) {
      const samples = this.history.slice(-10)
      if (samples.length < 4) {
        return { label: this.tr('Not enough data'), detail: this.tr('Based on the latest 10 samples'), tone: 'neutral', icon: 'mdi-minus' }
      }
      const middle = Math.floor(samples.length / 2)
      const average = list => list.reduce((sum, item) => sum + Number(item[key] || 0), 0) / list.length
      const previous = average(samples.slice(0, middle))
      const current = average(samples.slice(middle))
      const delta = Math.round((current - previous) * 10) / 10
      const label = delta > deadband ? this.tr('Rising') : (delta < -deadband ? this.tr('Falling') : this.tr('Stable'))
      const icon = delta > deadband ? 'mdi-trending-up' : (delta < -deadband ? 'mdi-trending-down' : 'mdi-trending-neutral')
      const tone = key === 'spo2' && delta < -deadband ? 'bad' : (Math.abs(delta) <= deadband ? 'neutral' : 'good')
      const detail = this.language === 'vi'
        ? `Trung bình thay đổi ${delta > 0 ? '+' : ''}${delta}${unit} giữa hai nửa cửa sổ dữ liệu.`
        : `The average changed by ${delta > 0 ? '+' : ''}${delta}${unit} between the two halves of the data window.`
      return { label, detail, tone, icon }
    },
    validateTelemetry (value) {
      const warnings = []
      const required = ['deviceId', 'timestamp', 'seq', 'heartRate', 'spo2', 'steps', 'fallDetected', 'battery', 'signalQuality', 'mode']
      const missing = required.filter(key => !Object.prototype.hasOwnProperty.call(value, key))
      if (missing.length) warnings.push(`Missing required fields: ${missing.join(', ')}`)
      if (value.deviceId && value.deviceId !== 'health-band-01') warnings.push('Unexpected deviceId')
      const numberRules = [
        ['heartRate', 40, 200],
        ['spo2', 70, 100],
        ['steps', 0, Number.MAX_SAFE_INTEGER],
        ['battery', 0, 100],
        ['seq', 0, Number.MAX_SAFE_INTEGER],
        ['timestamp', 0, Number.MAX_SAFE_INTEGER]
      ]
      numberRules.forEach(([key, minimum, maximum]) => {
        const number = Number(value[key])
        if (!Number.isFinite(number) || number < minimum || number > maximum) warnings.push(`Invalid ${key}`)
      })
      if (typeof value.fallDetected !== 'boolean') warnings.push('Invalid fallDetected')
      if (!['good', 'medium', 'poor'].includes(value.signalQuality)) warnings.push('Invalid signalQuality')
      if (!['normal', 'high_hr', 'low_hr', 'low_spo2', 'fall', 'low_battery'].includes(value.mode)) warnings.push('Invalid mode')
      const seq = Number(value.seq)
      const timestamp = Number(value.timestamp)
      if (this.lastPacketMeta.seq !== null) {
        if (seq === this.lastPacketMeta.seq) warnings.push('Duplicate sequence number')
        if (seq < this.lastPacketMeta.seq) warnings.push('Out-of-order sequence number')
        if (seq > this.lastPacketMeta.seq + 10) warnings.push('Large sequence gap')
      }
      if (this.lastPacketMeta.timestamp !== null && timestamp < this.lastPacketMeta.timestamp) warnings.push('Timestamp moved backwards')
      const critical = warnings.some(item => item.startsWith('Missing') || item.startsWith('Invalid'))
      return { warnings, critical, seq, timestamp }
    },
    updateAlertCounters () {
      const t = this.telemetry
      const thresholds = this.activeThresholds
      const next = { ...this.alertCounters }
      next.highHr = t.heartRate > thresholds.highHr ? Math.min(3, next.highHr + 1) : 0
      next.lowHr = t.heartRate > 0 && t.heartRate < thresholds.lowHr ? Math.min(3, next.lowHr + 1) : 0
      next.lowSpo2 = t.spo2 > 0 && t.spo2 < thresholds.lowSpo2 ? Math.min(3, next.lowSpo2 + 1) : 0
      this.alertCounters = next
      const confirmed = []
      if (next.highHr >= 3) confirmed.push('high-hr')
      if (next.lowHr >= 3) confirmed.push('low-hr')
      if (next.lowSpo2 >= 3) confirmed.push('low-spo2')
      this.confirmedAlertCodes = confirmed
      const activeCodes = new Set(['offline', 'fall', 'battery', ...confirmed])
      this.acknowledgedAlerts = Object.fromEntries(Object.entries(this.acknowledgedAlerts).filter(([code]) => activeCodes.has(code)))
    },
    updateNormalBaseline () {
      if (this.telemetry.mode !== 'normal' || this.telemetry.fallDetected || this.normalBaseline) return
      this.normalBaseline = {
        heartRate: this.telemetry.heartRate,
        spo2: this.telemetry.spo2,
        steps: this.telemetry.steps,
        battery: this.telemetry.battery
      }
    },
    saveStepGoal () {
      const goal = Math.round(Number(this.stepGoalInput))
      if (!Number.isFinite(goal)) return
      this.stepGoal = Math.max(100, Math.min(50000, goal))
      this.stepGoalInput = this.stepGoal
      this.stepGoalCustomized = true
      localStorage.setItem('healthBandStepGoal', String(this.stepGoal))
      localStorage.setItem('healthBandStepGoalCustomized', 'true')
      this.recordActivity('Smart coach', 'Goal saved', `${this.stepGoal.toLocaleString()} steps`, 'application')
    },
    selectProfile (profile) {
      const selected = this.profiles.find(item => item.id === profile)
      if (!selected) return
      this.profile = profile
      localStorage.setItem('healthBandProfile', profile)
      if (!this.stepGoalCustomized) {
        this.stepGoal = selected.suggestedGoal
        this.stepGoalInput = selected.suggestedGoal
        localStorage.setItem('healthBandStepGoal', String(selected.suggestedGoal))
      }
      this.alertCounters = { highHr: 0, lowHr: 0, lowSpo2: 0 }
      this.confirmedAlertCodes = []
      const requestId = `dashboard-${Date.now()}`
      this.send({ dashboardCommand: true, payload: { requestId, command: 'setProfile', value: profile } })
      this.recordActivity('Smart coach', 'Profile updated', `${selected.name} · ${requestId}`, 'application')
    },
    setPowerMode (mode) {
      if (!['normal', 'eco'].includes(mode)) return
      this.powerMode = mode
      const requestId = `dashboard-${Date.now()}`
      this.send({ dashboardCommand: true, payload: { requestId, command: 'setPowerMode', value: mode } })
      this.recordActivity('Smart coach', 'Power mode updated', `${mode} · ${requestId}`, 'application')
    },
    acknowledgeAlert (alert) {
      const timestamp = new Date().toISOString()
      this.acknowledgedAlerts = { ...this.acknowledgedAlerts, [alert.code]: timestamp }
      const requestId = `dashboard-${Date.now()}`
      const mqttAlertCodes = {
        'high-hr': 'HIGH_HEART_RATE',
        'low-hr': 'LOW_HEART_RATE',
        'low-spo2': 'LOW_SPO2',
        fall: 'FALL_DETECTED',
        battery: 'LOW_BATTERY',
        offline: 'DEVICE_OFFLINE'
      }
      this.send({ dashboardCommand: true, payload: { requestId, command: 'ackAlert', value: mqttAlertCodes[alert.code] || alert.code } })
      this.recordActivity('User', 'Alert acknowledged', `${alert.title} · ${timestamp}`, 'application')
    },
    startEmergencyCountdown () {
      if (this.emergency.active || this.emergencyTriggeredForFall) return
      this.emergencyTriggeredForFall = true
      this.emergency = { active: true, countdown: 10, status: 'pending' }
      if (this.emergencyTimer) clearInterval(this.emergencyTimer)
      this.recordActivity('Safety', 'Emergency countdown started', '10-second simulated response window', 'rejected')
      this.emergencyTimer = setInterval(() => {
        const next = this.emergency.countdown - 1
        if (next <= 0) {
          this.sendEmergency()
          return
        }
        this.emergency = { ...this.emergency, countdown: next }
      }, 1000)
    },
    cancelEmergency () {
      if (this.emergencyTimer) clearInterval(this.emergencyTimer)
      this.emergencyTimer = null
      this.emergency = { active: false, countdown: 0, status: 'canceled' }
      const requestId = `dashboard-${Date.now()}`
      this.send({ dashboardCommand: true, payload: { requestId, command: 'emergencyAction', value: 'cancel' } })
      this.recordActivity('User', 'Emergency canceled', `Wearer marked safe · ${requestId}`, 'application')
    },
    sendEmergency () {
      if (this.emergencyTimer) clearInterval(this.emergencyTimer)
      this.emergencyTimer = null
      this.emergency = { active: false, countdown: 0, status: 'sent' }
      const requestId = `dashboard-${Date.now()}`
      this.send({ dashboardCommand: true, payload: { requestId, command: 'emergencyAction', value: 'send' } })
      this.recordActivity('Safety', 'Emergency notification sent', `SIMULATED ONLY · ${requestId}`, 'rejected')
    },
    dismissEmergency () {
      this.emergency = { active: false, countdown: 10, status: 'idle' }
    },
    exportSessionReport () {
      const report = {
        generatedAt: new Date().toISOString(),
        disclaimer: 'Educational simulation only. Not for medical diagnosis.',
        deviceId: this.telemetry.deviceId,
        profile: this.profile,
        stepGoal: this.stepGoal,
        healthScore: this.healthScore,
        scoreBreakdown: this.scoreBreakdown,
        telemetry: this.telemetry,
        thresholds: this.activeThresholds,
        activeAlerts: this.activeAlerts,
        dataQualityWarnings: this.dataQualityWarnings,
        normalBaseline: this.normalBaseline,
        activity: this.activity
      }
      const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json;charset=utf-8' })
      const url = URL.createObjectURL(blob)
      const link = document.createElement('a')
      link.href = url
      link.download = `health-band-session-${Date.now()}.json`
      link.click()
      URL.revokeObjectURL(url)
      this.recordActivity('Smart coach', 'Report downloaded', `${report.activeAlerts.length} alerts · score ${report.healthScore}`, 'application')
    },
    clearSessionData () {
      this.stopGuidedDemo(false)
      if (this.emergencyTimer) clearInterval(this.emergencyTimer)
      this.history = []
      this.activity = []
      this.activityId = 0
      this.normalBaseline = null
      this.alertCounters = { highHr: 0, lowHr: 0, lowSpo2: 0 }
      this.confirmedAlertCodes = []
      this.acknowledgedAlerts = {}
      this.dataQualityWarnings = []
      this.rejectedPackets = 0
      this.lastPacketMeta = { seq: null, timestamp: null }
      this.emergency = { active: false, countdown: 10, status: 'idle' }
      this.emergencyTriggeredForFall = false
      this.stepGoal = 6000
      this.stepGoalInput = 6000
      this.stepGoalCustomized = false
      this.profile = 'student'
      localStorage.removeItem('healthBandStepGoal')
      localStorage.removeItem('healthBandStepGoalCustomized')
      localStorage.removeItem('healthBandProfile')
      this.recordActivity('Smart coach', 'Session cleared', 'Local history, alerts, goal, profile and quality warnings cleared', 'application')
    },
    startGuidedDemo () {
      this.stopGuidedDemo(false)
      this.guidedDemo.running = true
      this.guidedDemo.index = 0
      this.recordActivity('Smart coach', 'Automatic demo started', 'Six MQTT-controlled scenarios', 'presenter')
      this.sendMode(this.guidedDemo.sequence[0].mode)
      this.guidedDemo.timer = setInterval(() => {
        if (this.guidedDemo.index >= this.guidedDemo.sequence.length - 1) {
          this.stopGuidedDemo(false)
          return
        }
        this.guidedDemo.index++
        this.sendMode(this.guidedDemo.sequence[this.guidedDemo.index].mode)
      }, 6500)
    },
    stopGuidedDemo (record = true) {
      if (this.guidedDemo.timer) clearInterval(this.guidedDemo.timer)
      this.guidedDemo.timer = null
      const wasRunning = this.guidedDemo.running
      this.guidedDemo.running = false
      if (record && wasRunning) this.recordActivity('Smart coach', 'Automatic demo stopped', 'Presenter stopped the scenario sequence', 'presenter')
    },
    consumeMessage (message) {
      let value = message && message.payload
      if (!value) return
      try { if (typeof value === 'string') value = JSON.parse(value) } catch (error) { return }
      if (!value || typeof value !== 'object') return

      if (message.kind === 'alert') {
        this.recordActivity(
          'Rules',
          value.type || 'Health alert',
          value.message || 'Node-RED threshold rule triggered',
          value.severity === 'critical' ? 'rejected' : 'processing'
        )
        return
      }

      if (message.kind === 'event' || value.eventType) {
        this.lastAcknowledgement = value.message || value.eventType
        if (value.activeMode) this.activeMode = value.activeMode
        this.recordActivity(
          'Device',
          value.eventType || 'Device event',
          `${value.message || 'Event received'}${value.activeMode ? ` · Mode: ${value.activeMode}` : ''}`,
          value.eventType === 'COMMAND_REJECTED' ? 'rejected' : 'device'
        )
        return
      }

      if (message.kind === 'status' || Object.prototype.hasOwnProperty.call(value, 'online')) {
        const online = value.online === true
        if (this.lastNetworkState !== online) {
          this.lastNetworkState = online
          this.recordActivity(
            'Network',
            online ? 'Device connected' : 'Device disconnected',
            `Firmware ${value.firmwareVersion || 'unknown'} · Mode ${value.activeMode || 'unknown'}`,
            online ? 'network' : 'rejected'
          )
        }
        if (value.activeMode) this.activeMode = value.activeMode
        return
      }

      const validation = this.validateTelemetry(value)
      const nodeWarnings = Array.isArray(message.qualityWarnings) ? message.qualityWarnings : []
      const currentWarnings = [...new Set([...validation.warnings, ...nodeWarnings])]
      if (currentWarnings.length) {
        const recentWarnings = Date.now() - this.dataQualityLastIssueAt <= 5000
          ? this.dataQualityWarnings
          : []
        this.dataQualityWarnings = [...new Set([...recentWarnings, ...currentWarnings])]
        this.dataQualityLastIssueAt = Date.now()
      } else if (Date.now() - this.dataQualityLastIssueAt > 5000) {
        this.dataQualityWarnings = []
      }
      if (validation.critical) {
        this.rejectedPackets++
        this.recordActivity('Data quality', 'Telemetry rejected', this.dataQualityWarnings.join(' · '), 'rejected')
        return
      }
      this.lastPacketMeta = { seq: validation.seq, timestamp: validation.timestamp }
      const previousMode = this.telemetry.mode
      this.telemetry = {
        deviceId: value.deviceId || 'health-band-01',
        heartRate: Number(value.heartRate),
        spo2: Number(value.spo2),
        steps: Number(value.steps),
        battery: Number(value.battery),
        fallDetected: value.fallDetected === true,
        signalQuality: value.signalQuality || 'unknown',
        seq: Number(value.seq || 0),
        mode: value.mode || this.activeMode,
        timestamp: Number(value.timestamp || 0),
        profile: value.profile || this.profile,
        powerMode: value.powerMode || (Number(value.battery) <= 20 ? 'eco' : this.powerMode),
        samplingIntervalMs: Number(value.samplingIntervalMs || (value.powerMode === 'eco' ? 8000 : 2000))
      }
      if (value.mode) this.activeMode = value.mode
      if (value.profile && this.profiles.some(item => item.id === value.profile)) this.profile = value.profile
      this.powerMode = this.telemetry.powerMode
      this.lastSeen = Date.now()
      this.now = this.lastSeen
      if (this.lastNetworkState !== true) {
        this.lastNetworkState = true
        this.recordActivity(
          'Network',
          'Device connected',
          `Live telemetry resumed · Sequence #${this.telemetry.seq}`,
          'network'
        )
      }
      this.history.push({
        heartRate: this.telemetry.heartRate,
        spo2: this.telemetry.spo2,
        steps: this.telemetry.steps,
        battery: this.telemetry.battery,
        timestamp: this.telemetry.timestamp,
        seq: this.telemetry.seq
      })
      if (this.history.length > 40) this.history.shift()
      this.updateAlertCounters()
      this.updateNormalBaseline()
      if (this.telemetry.fallDetected) {
        this.startEmergencyCountdown()
      } else {
        this.emergencyTriggeredForFall = false
      }
      if (previousMode && previousMode !== this.telemetry.mode) {
        this.recordActivity('Telemetry', 'Device mode updated', `Telemetry confirms mode ${this.telemetry.mode}`, 'telemetry')
      }
    },
    recordActivity (source, title, detail, sourceClass) {
      this.activity.unshift({
        id: ++this.activityId,
        time: new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date()),
        source,
        title,
        detail,
        sourceClass
      })
      if (this.activity.length > 30) this.activity.pop()
      const notificationSources = ['Rules', 'Device', 'Network', 'Safety', 'Data quality']
      if (notificationSources.includes(source)) {
        const critical = sourceClass === 'rejected' || source === 'Safety'
        const warning = sourceClass === 'processing' || source === 'Rules'
        const tone = critical ? 'critical' : (warning ? 'warning' : 'success')
        const icon = critical
          ? 'mdi-alert-octagon-outline'
          : (warning
              ? 'mdi-alert-circle-outline'
              : (source === 'Network' ? 'mdi-access-point-check' : 'mdi-check-circle-outline'))
        this.pushNotification(title, detail, tone, icon)
      }
    },
    makePoints (key, minimum, maximum) {
      if (!this.history.length) return ''
      const range = maximum - minimum
      const count = Math.max(this.history.length - 1, 1)
      return this.history.map((item, index) => {
        const x = (index / count) * 760
        const normalized = Math.max(0, Math.min(1, (Number(item[key]) - minimum) / range))
        return `${x.toFixed(1)},${(138 - normalized * 126).toFixed(1)}`
      }).join(' ')
    },
    sendMode (mode) {
      this.activeMode = mode
      const requestId = `dashboard-${Date.now()}`
      this.commandState = `Sent - ${this.activeModeLabel}`
      this.recordActivity('Application', 'Command sent', `setMode = ${mode} · ${requestId}`, 'application')
      this.send({ dashboardCommand: true, payload: { requestId, command: 'setMode', value: mode } })
      setTimeout(() => { this.commandState = 'Ready' }, 1800)
    },
    resetSteps () {
      const requestId = `dashboard-${Date.now()}`
      this.commandState = 'Sent - Reset steps'
      this.recordActivity('Application', 'Command sent', `resetSteps · ${requestId}`, 'application')
      this.send({ dashboardCommand: true, payload: { requestId, command: 'resetSteps' } })
      setTimeout(() => { this.commandState = 'Ready' }, 1800)
    },
    playDataJourney () {
      if (this.journeyTimer) clearInterval(this.journeyTimer)
      this.journeyRunning = true
      this.journeyStep = 0
      this.selectedLayer = 0
      this.recordActivity('Application', 'Data journey started', 'Following telemetry through all four IoT layers', 'application')
      this.journeyTimer = setInterval(() => {
        if (this.journeyStep >= 3) {
          clearInterval(this.journeyTimer)
          this.journeyRunning = false
          return
        }
        this.journeyStep++
        this.selectedLayer = this.journeyStep
      }, 1300)
    },
    previousPresenterStep () {
      if (this.presenterIndex > 0) this.presenterIndex--
    },
    nextPresenterStep () {
      if (this.presenterIndex < this.presenterSteps.length - 1) this.presenterIndex++
    },
    runPresenterStep () {
      const step = this.presenterStep
      this.recordActivity('Presenter', `Step ${this.presenterIndex + 1}: ${step.title}`, step.description, 'presenter')
      if (step.mode) {
        this.sendMode(step.mode)
      } else if (step.action === 'journey') {
        this.activeView = 'architecture'
        this.playDataJourney()
      } else if (step.action === 'view-twin') {
        this.activeView = 'twin'
      }
    }
  }
}
</script>
