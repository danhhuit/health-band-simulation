  computed: {
    isOnline () {
      return this.lastSeen > 0 && this.now - this.lastSeen <= 8000
    },
    formattedDate () {
      return new Intl.DateTimeFormat(this.language === 'vi' ? 'vi-VN' : 'en-US', { weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(this.now))
    },
    watchTime () {
      return new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(this.now))
    },
    lastUpdateText () {
      if (!this.lastSeen) return this.tr('Waiting for data')
      const seconds = Math.max(0, Math.floor((this.now - this.lastSeen) / 1000))
      if (seconds < 2) return this.tr('Just now')
      return this.language === 'vi' ? `${seconds} giây trước` : `${seconds} seconds ago`
    },
    activeModeLabel () {
      return this.tr(({
        normal: 'Normal',
        high_hr: 'High heart rate',
        low_hr: 'Low heart rate',
        low_spo2: 'Low SpO₂',
        fall: 'Fall detected',
        low_battery: 'Low battery'
      })[this.activeMode] || 'Normal')
    },
    selectedLayerData () {
      return this.architectureLayers[this.selectedLayer]
    },
    presenterStep () {
      return this.presenterSteps[this.presenterIndex]
    },
    livePacket () {
      return JSON.stringify({
        deviceId: this.telemetry.deviceId,
        seq: this.telemetry.seq,
        heartRate: this.telemetry.heartRate,
        spo2: this.telemetry.spo2,
        steps: this.telemetry.steps,
        battery: this.telemetry.battery,
        fallDetected: this.telemetry.fallDetected,
        signalQuality: this.telemetry.signalQuality,
        mode: this.telemetry.mode
      }, null, 2)
    },
    rgbState () {
      if (!this.isOnline) return 'blue'
      if (this.telemetry.fallDetected || this.activeMode === 'fall') return 'red'
      if (this.activeMode === 'normal') return 'green'
      return 'amber'
    },
    rgbStateLabel () {
      return this.tr(({ blue: 'BLUE', red: 'RED', green: 'GREEN', amber: 'AMBER' })[this.rgbState])
    },
    buzzerState () {
      if (this.activeMode === 'fall') return this.tr('CRITICAL')
      return this.activeMode === 'normal' ? this.tr('STANDBY') : this.tr('BEEP')
    },
    signalText () {
      const value = String(this.telemetry.signalQuality || 'unknown')
      return this.tr(({ good: 'Good', medium: 'Medium', poor: 'Poor', unknown: 'Unknown' })[value] || 'Unknown')
    },
    statusTitle () {
      if (!this.isOnline) return this.tr('Device is offline')
      if (this.telemetry.fallDetected) return this.tr('Fall detected')
      if (this.telemetry.heartRate > 120) return this.tr('Heart rate is above the demo range')
      if (this.telemetry.heartRate > 0 && this.telemetry.heartRate < 50) return this.tr('Heart rate is below the demo range')
      if (this.telemetry.spo2 > 0 && this.telemetry.spo2 < 94) return this.tr('Blood oxygen is below the demo range')
      if (this.telemetry.battery <= 20) return this.tr('Device battery is low')
      return this.tr('Readings look normal')
    },
    statusDescription () {
      if (!this.isOnline) return this.tr('No telemetry has been received in the last 8 seconds.')
      if (this.activeAlerts.length) return this.tr('Review the active alert details below.')
      return this.tr('No simulated health alerts require attention right now.')
    },
    statusTone () {
      if (!this.isOnline || this.telemetry.fallDetected) return 'critical'
      return this.activeAlerts.length ? 'warning' : 'healthy'
    },
    statusIcon () {
      if (!this.isOnline) return 'mdi-cloud-off-outline'
      if (this.telemetry.fallDetected) return 'mdi-alert-octagon-outline'
      return this.activeAlerts.length ? 'mdi-alert-circle-outline' : 'mdi-check-circle-outline'
    },
    heartRateState () {
      if (!this.telemetry.heartRate) return { label: this.tr('Waiting'), tone: 'neutral' }
      if (this.telemetry.heartRate > 120) return { label: this.tr('High'), tone: 'bad' }
      if (this.telemetry.heartRate < 50) return { label: this.tr('Low'), tone: 'bad' }
      return { label: this.tr('In range'), tone: 'good' }
    },
    oxygenState () {
      if (!this.telemetry.spo2) return { label: this.tr('Waiting'), tone: 'neutral' }
      return this.telemetry.spo2 < 94 ? { label: this.tr('Low'), tone: 'bad' } : { label: this.tr('In range'), tone: 'good' }
    },
    batteryState () {
      if (!this.isOnline) return { label: this.tr('Unknown'), tone: 'neutral' }
      return this.telemetry.battery <= 20 ? { label: this.tr('Low'), tone: 'bad' } : { label: this.tr('Good'), tone: 'good' }
    },
    activeAlerts () {
      const t = this.telemetry
      const alerts = []
      if (!this.isOnline) alerts.push({ code: 'offline', severity: 'critical', title: this.tr('Device offline'), detail: this.tr('No telemetry received for more than 8 seconds.') })
      if (t.fallDetected) alerts.push({ code: 'fall', severity: 'critical', title: this.tr('Fall detected'), detail: this.tr('The simulated fall event has been triggered.') })
      if (t.heartRate > 120) alerts.push({ code: 'high-hr', severity: 'warning', title: this.tr('High heart rate'), detail: this.language === 'vi' ? `${t.heartRate} BPM vượt ngưỡng demo 120 BPM.` : `${t.heartRate} BPM exceeds the 120 BPM demo threshold.` })
      if (t.heartRate > 0 && t.heartRate < 50) alerts.push({ code: 'low-hr', severity: 'warning', title: this.tr('Low heart rate'), detail: this.language === 'vi' ? `${t.heartRate} BPM thấp hơn ngưỡng demo 50 BPM.` : `${t.heartRate} BPM is below the 50 BPM demo threshold.` })
      if (t.spo2 > 0 && t.spo2 < 94) alerts.push({ code: 'low-spo2', severity: 'warning', title: this.tr('Low blood oxygen'), detail: this.language === 'vi' ? `${t.spo2}% thấp hơn ngưỡng demo 94%.` : `${t.spo2}% is below the 94% demo threshold.` })
      if (this.isOnline && t.battery <= 20) alerts.push({ code: 'battery', severity: 'warning', title: this.tr('Low battery'), detail: this.language === 'vi' ? `Pin còn ${t.battery}%.` : `${t.battery}% battery remaining.` })
      return alerts
    },
    heartRatePoints () {
      return this.makePoints('heartRate', 35, 155)
    },
    spo2Points () {
      return this.makePoints('spo2', 80, 100)
    }
  },
  mounted () {
    document.documentElement.lang = this.language
    this.consumeMessage(this.msg)
    this.socketHandler = message => this.consumeMessage(message)
    this.$socket.on('msg-input:' + this.id, this.socketHandler)
    const requestedView = new URLSearchParams(window.location.search).get('view')
    if (['overview', 'twin', 'architecture', 'presenter', 'guide'].includes(requestedView)) {
      this.activeView = requestedView
    }
    this.clock = setInterval(() => { this.now = Date.now() }, 1000)
  },
  unmounted () {
    clearInterval(this.clock)
    if (this.journeyTimer) clearInterval(this.journeyTimer)
    if (this.socketHandler) this.$socket.off('msg-input:' + this.id, this.socketHandler)
  },
  methods: {
    tr (text) {
      if (this.language !== 'vi') return text
      return this.viTranslations[text] || text
    },
    setLanguage (language) {
      this.language = language
      localStorage.setItem('healthBandLanguage', language)
      document.documentElement.lang = language
    },
    consumeMessage (message) {
      let value = message && message.payload
      if (!value) return
      try { if (typeof value === 'string') value = JSON.parse(value) } catch (error) { return }
      if (!value || typeof value !== 'object') return

      if (message.kind === 'alert') {
        this.recordActivity(
          'Rules',
          value.type || 'Health alert',
          value.message || 'Node-RED threshold rule triggered',
          value.severity === 'critical' ? 'rejected' : 'processing'
        )
        return
      }

      if (message.kind === 'event' || value.eventType) {
        this.lastAcknowledgement = value.message || value.eventType
        if (value.activeMode) this.activeMode = value.activeMode
        this.recordActivity(
          'Device',
          value.eventType || 'Device event',
          `${value.message || 'Event received'}${value.activeMode ? ` · Mode: ${value.activeMode}` : ''}`,
          value.eventType === 'COMMAND_REJECTED' ? 'rejected' : 'device'
        )
        return
      }

      if (message.kind === 'status' || Object.prototype.hasOwnProperty.call(value, 'online')) {
        this.recordActivity(
          'Network',
          value.online ? 'Device connected' : 'Device disconnected',
          `Firmware ${value.firmwareVersion || 'unknown'} · Mode ${value.activeMode || 'unknown'}`,
          'network'
        )
        if (value.activeMode) this.activeMode = value.activeMode
        return
      }

      if (!Number.isFinite(Number(value.heartRate))) return
      const previousMode = this.telemetry.mode
      this.telemetry = {
        deviceId: value.deviceId || 'health-band-01',
        heartRate: Number(value.heartRate),
        spo2: Number(value.spo2),
        steps: Number(value.steps),
        battery: Number(value.battery),
        fallDetected: value.fallDetected === true,
        signalQuality: value.signalQuality || 'unknown',
        seq: Number(value.seq || 0),
        mode: value.mode || this.activeMode
      }
      if (value.mode) this.activeMode = value.mode
      this.lastSeen = Date.now()
      this.now = this.lastSeen
      this.history.push({ heartRate: this.telemetry.heartRate, spo2: this.telemetry.spo2 })
      if (this.history.length > 40) this.history.shift()
      if (previousMode && previousMode !== this.telemetry.mode) {
        this.recordActivity('Telemetry', 'Device mode updated', `Telemetry confirms mode ${this.telemetry.mode}`, 'telemetry')
      }
    },
    recordActivity (source, title, detail, sourceClass) {
      this.activity.unshift({
        id: ++this.activityId,
        time: new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date()),
        source,
        title,
        detail,
        sourceClass
      })
      if (this.activity.length > 30) this.activity.pop()
    },
    makePoints (key, minimum, maximum) {
      if (!this.history.length) return ''
      const range = maximum - minimum
      const count = Math.max(this.history.length - 1, 1)
      return this.history.map((item, index) => {
        const x = (index / count) * 760
        const normalized = Math.max(0, Math.min(1, (Number(item[key]) - minimum) / range))
        return `${x.toFixed(1)},${(138 - normalized * 126).toFixed(1)}`
      }).join(' ')
    },
    sendMode (mode) {
      this.activeMode = mode
      const requestId = `dashboard-${Date.now()}`
      this.commandState = `Sent - ${this.activeModeLabel}`
      this.recordActivity('Application', 'Command sent', `setMode = ${mode} · ${requestId}`, 'application')
      this.send({ dashboardCommand: true, payload: { requestId, command: 'setMode', value: mode } })
      setTimeout(() => { this.commandState = 'Ready' }, 1800)
    },
    resetSteps () {
      const requestId = `dashboard-${Date.now()}`
      this.commandState = 'Sent - Reset steps'
      this.recordActivity('Application', 'Command sent', `resetSteps · ${requestId}`, 'application')
      this.send({ dashboardCommand: true, payload: { requestId, command: 'resetSteps' } })
      setTimeout(() => { this.commandState = 'Ready' }, 1800)
    },
    playDataJourney () {
      if (this.journeyTimer) clearInterval(this.journeyTimer)
      this.journeyRunning = true
      this.journeyStep = 0
      this.selectedLayer = 0
      this.recordActivity('Application', 'Data journey started', 'Following telemetry through all four IoT layers', 'application')
      this.journeyTimer = setInterval(() => {
        if (this.journeyStep >= 3) {
          clearInterval(this.journeyTimer)
          this.journeyRunning = false
          return
        }
        this.journeyStep++
        this.selectedLayer = this.journeyStep
      }, 1300)
    },
    previousPresenterStep () {
      if (this.presenterIndex > 0) this.presenterIndex--
    },
    nextPresenterStep () {
      if (this.presenterIndex < this.presenterSteps.length - 1) this.presenterIndex++
    },
    runPresenterStep () {
      const step = this.presenterStep
      this.recordActivity('Presenter', `Step ${this.presenterIndex + 1}: ${step.title}`, step.description, 'presenter')
      if (step.mode) {
        this.sendMode(step.mode)
      } else if (step.action === 'journey') {
        this.activeView = 'architecture'
        this.playDataJourney()
      } else if (step.action === 'view-twin') {
        this.activeView = 'twin'
      }
    }
  }
}
